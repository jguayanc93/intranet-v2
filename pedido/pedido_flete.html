<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicar flete a un pedido - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Flete</title>
</head>

<body data-modulo="pedido" data-titulo="Flete">

<div class="cdk-pagina">

    <!-- ============ BUSCAR ============ -->
    <section class="cdk-seccion" id="seccion-buscar">
        <h2 class="cdk-seccion__titulo">Aplicar flete a un pedido</h2>
        <p class="cdk-seccion__sub">
            El flete de provincia es un descuento del 0,4&nbsp;% que aplica el ERP. Aquí se
            dispara y se ve el resultado. Si el pedido no llega al mínimo, se dice cuánto falta.
        </p>

        <!-- La ruta filtra por el vendedor de la galleta, así que el pedido de
             otro no se entrega aunque se escriba su número. -->
        <form id="form-buscar">
            <div class="cdk-campo">
                <label class="cdk-campo__etiqueta" for="npedi">Número de pedido</label>
                <input type="search" name="npedi" id="npedi"
                       class="cdk-entrada"
                       inputmode="numeric"
                       autocomplete="off"
                       placeholder="Ej: 099-00132184">
                <p class="cdk-campo__ayuda">Con su serie, como aparece en la lista de pedidos.</p>
            </div>

            <button type="submit" id="btn-buscar" class="cdk-boton cdk-boton--primario">
                Buscar
            </button>
        </form>

        <div id="buscando" style="margin-top:12px"></div>
    </section>

    <!-- ============ EL PEDIDO ============ -->
    <section class="cdk-seccion hidden" id="seccion-pedido">
        <div class="cdk-paso__cabecera">
            <button type="button" id="btn-volver" class="cdk-navbar__atras" aria-label="Buscar otro pedido">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round" class="cdk-icono" aria-hidden="true">
                    <path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                </svg>
            </button>
            <h2 class="cdk-paso__titulo" id="titulo-pedido">Pedido</h2>
        </div>

        <div id="resumen"></div>

        <div class="cdk-acciones-fila" style="margin:16px 0">
            <button type="button" id="btn-flete" class="cdk-boton cdk-boton--primario">
                Aplicar flete
            </button>
        </div>

        <!-- El resultado de aplicar: los totales nuevos, o el motivo por el
             que no se pudo. Va antes de los productos para que se lea sin
             tener que desplazarse de vuelta hacia arriba. -->
        <div id="resultado"></div>

        <div id="productos" style="margin-top:16px"></div>
    </section>

</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<script src="/js/pedido/flete.js"></script>
</body>
</html>
