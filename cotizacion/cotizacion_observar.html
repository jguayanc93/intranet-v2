<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ver cotización - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <!-- El documento para el cliente trae su propia hoja: no hereda los colores
         de la intranet ni el tema oscuro, y manda la impresión. -->
    <link rel="stylesheet" href="/core/cdk-documento.css">
    <title>CDK · Ver Cotización</title>
</head>

<body data-modulo="cotizacion" data-titulo="Ver Cotización">

<div class="cdk-pagina" id="cdk-pantalla">

    <!-- ============ ELEGIR UNA COTIZACIÓN ============ -->
    <section class="cdk-seccion" id="seccion-elegir">
        <h2 class="cdk-seccion__titulo">Mis cotizaciones</h2>

        <!-- Abre con las de hoy, que es el caso normal; se amplía a dos días
             solo si el vendedor no encuentra la que busca. -->
        <div class="cdk-acciones-fila" role="group" aria-label="Periodo">
            <button type="button" id="btn-hoy" class="cdk-boton cdk-boton--primario" aria-pressed="true">
                Hoy
            </button>
            <button type="button" id="btn-dos-dias" class="cdk-boton cdk-boton--suave" aria-pressed="false">
                2 días
            </button>
        </div>

        <div id="lista-cotis" style="margin-top:12px"></div>

        <!-- Buscar por número queda como salida para una cotización vieja, que
             no va a estar en la lista del día. Plegado para no competir con lo
             que se usa a diario. -->
        <details class="cdk-plegable" style="margin-top:16px">
            <summary class="cdk-plegable__titulo">Buscar una cotización por su número</summary>

            <form id="form-buscar" class="cdk-buscador" style="margin-top:12px">
                <div class="cdk-buscador__campo">
                    <label class="cdk-campo__etiqueta" for="ncoti">Número de cotización</label>
                    <!-- inputmode numérico: en el móvil abre el teclado de números
                         directamente, que es lo que se teclea aquí. -->
                    <input type="search" name="ncoti" id="ncoti"
                           class="cdk-entrada"
                           inputmode="numeric"
                           autocomplete="off"
                           placeholder="Ej: 009-00971087"
                           required>
                    <p class="cdk-campo__ayuda">Con su serie, como aparece en la lista. Un número
                        suelto se interpreta siempre como serie 009-, y las cotizaciones nuevas
                        llevan 098-.</p>
                </div>
                <button type="submit" id="buscar-coti" class="cdk-boton cdk-boton--suave">Buscar</button>
            </form>
        </details>
    </section>

    <!-- ============ LA COTIZACIÓN ELEGIDA ============ -->
    <section class="cdk-seccion hidden" id="seccion-detalle">
        <div class="cdk-paso__cabecera">
            <button type="button" id="btn-volver" class="cdk-navbar__atras" aria-label="Volver a la lista">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round" class="cdk-icono" aria-hidden="true">
                    <path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                </svg>
            </button>
            <h2 class="cdk-paso__titulo" id="titulo-coti">Cotización</h2>
        </div>

        <!-- Dos vistas de lo mismo. El resumen lleva margen y coste, que son
             datos internos; el documento es lo que ve el cliente. Separarlos
             evita que el margen acabe en un PDF que sale de la empresa. -->
        <div class="cdk-acciones-fila" role="group" aria-label="Vista">
            <button type="button" id="btn-vista-resumen" class="cdk-boton cdk-boton--primario" aria-pressed="true">
                Resumen
            </button>
            <button type="button" id="btn-vista-documento" class="cdk-boton cdk-boton--suave" aria-pressed="false">
                Documento
            </button>
            <button type="button" id="btn-pdf" class="cdk-boton cdk-boton--suave hidden">
                Guardar PDF
            </button>
        </div>

        <div id="contendor-final-final" style="margin-top:12px"></div>
    </section>

</div>

<!-- El documento vive fuera de .cdk-pagina: al imprimir se oculta todo lo demás
     y esto queda solo, a tamaño A4. -->
<div class="cdk-doc__lienzo hidden" id="lienzo-documento"></div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<!-- legado: aún lo usan otras pantallas del módulo -->
<script src="/js/global/variables.js"></script>
<script src="/caminos/rutas.js"></script>

<script src="/js/cotizacion/campos.js"></script>
<!-- La lista de "mis cotizaciones", compartida con Modificar y Cambiar almacén. -->
<script src="/js/cotizacion/lista_dia.js"></script>
<script src="/js/cotizacion/documento.js"></script>
<script src="/js/cotizacion/ver_cotizacion.js"></script>
</body>
</html>
