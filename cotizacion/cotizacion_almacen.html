<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cambiar almacén de cotización - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Cambiar Almacén</title>
</head>

<body data-modulo="cotizacion" data-titulo="Cambiar Almacén">

<div class="cdk-pagina">

    <section class="cdk-seccion">
        <h2 class="cdk-seccion__titulo">Cambiar almacén de una cotización</h2>
        <p class="cdk-seccion__sub">
            Solo se puede cambiar el almacén de cotizaciones que aún no estén aprobadas.
            El cambio afecta a la disponibilidad de los productos.
        </p>

        <!-- La lista viene filtrada por el vendedor de la galleta, así que por
             aquí es imposible llegar a la cotización de otro. Buscar por número
             no tiene esa garantía, pero el backend ya la valida:
             ver docs/autorizacion-cotizacion.md. -->
        <div class="cdk-acciones-fila" role="group" aria-label="Periodo">
            <button type="button" id="btn-hoy" class="cdk-boton cdk-boton--primario" aria-pressed="true">
                Hoy
            </button>
            <button type="button" id="btn-dos-dias" class="cdk-boton cdk-boton--suave" aria-pressed="false">
                2 días
            </button>
        </div>

        <div id="lista-cotis" style="margin:12px 0"></div>

        <form id="form-almacen">
            <details class="cdk-plegable" style="margin-bottom:16px">
                <summary class="cdk-plegable__titulo">O escribe el número</summary>
                <div class="cdk-campo" style="margin-top:12px">
                    <label class="cdk-campo__etiqueta" for="busqueda">Número de cotización</label>
                    <input type="search" name="busqueda" id="busqueda"
                           class="cdk-entrada"
                           inputmode="numeric"
                           autocomplete="off"
                           placeholder="Ej: 009-00971087">
                    <p class="cdk-campo__ayuda">Con su serie, como aparece en la lista. Sin ella
                        el backend no sabría a cuál de las dos se refiere.</p>
                </div>
            </details>

            <!-- Qué cotización se va a mover, a la vista mientras se elige el
                 almacén: si no, hay que desplegar el buscador para comprobarlo. -->
            <p id="coti-elegida" class="cdk-ficha__titulo hidden" style="margin-bottom:12px"></p>

            <div class="cdk-campo">
                <label class="cdk-campo__etiqueta" for="alm">Nuevo almacén</label>
                <!-- Las opciones las rellena cdk-catalogo.js, para que los
                     nombres de almacén vivan en un solo sitio. -->
                <select id="alm" name="alm" class="cdk-entrada"></select>
            </div>

            <button type="submit" id="cambio" class="cdk-boton cdk-boton--primario">
                Cambiar almacén
            </button>
        </form>
    </section>

    <div id="resultado"></div>

</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<!-- campos.js NO se carga aquí a propósito: lee #alm como selector de moneda
     y en esta pantalla ese id es el ALMACÉN. lista_dia.js no lo necesita. -->
<!-- La lista de "mis cotizaciones", compartida con Ver y Modificar. -->
<script src="/js/cotizacion/lista_dia.js"></script>
<script src="/js/cotizacion/cambio_almacen.js"></script>
</body>
</html>
