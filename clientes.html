<!-- Una sola pantalla, para el jefe de zona (grupo 34), que se llama Cobertura (la clave del menú sigue siendo `clientes`): sin nada
     elegido, cartera o cobertura; con `?tipo=CARTERA`, la lista de los vendedores de ese tipo; con `?codusu=293` (y, si se sabe,
     `&tipo=CARTERA`), los clientes de ese vendedor. El menú trae una sola clave, `clientes`, pero el backend tiene dos rutas:
     la pantalla elige `/zona/cartera` o `/zona/cobertura` por el tipo del vendedor ese mes. No es la cobertura de clientes por marca
     del grupo 25 (cobertura.html) ni la lista de clientes del grupo 20 (lista/). -->
<body data-modulo="clientes" data-titulo="Cobertura">

<div class="cdk-pagina">
    <header class="cdk-cabecera">
        <h1 class="cdk-cabecera__titulo">Cobertura</h1>
        <p class="cdk-cabecera__sub" id="periodo">Los clientes de cada vendedor</p>
    </header>

    <div id="contenido"></div>
</div>
