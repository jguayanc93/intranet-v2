<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vendedor del mes por marca - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Vendedor del mes</title>
</head>

<!-- Una sola pantalla, no un hub: el módulo `vendedormes` no tiene acciones que
     listar (`GET /v1/vendedormes` no existe). Se queda en la raíz, que es donde la
     tarjeta del menú ya apunta, como Reportes, Marcas y Cobertura. -->
<body data-modulo="vendedormes" data-titulo="Vendedor del mes">

<div class="cdk-pagina">
    <header class="cdk-cabecera">
        <h1 class="cdk-cabecera__titulo">Vendedor del mes</h1>
        <p class="cdk-cabecera__sub" id="periodo">Los 3 vendedores que más venden cada una de tus marcas</p>
    </header>

    <div id="contenido"></div>
</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<!-- Comparte con Marcas el nombre del periodo y la lectura de los errores. -->
<script src="/js/marcas/datos.js"></script>
<script src="/js/vendedormes/datos.js"></script>
<script src="/js/vendedormes/vendedormes.js"></script>
</body>
</html>
