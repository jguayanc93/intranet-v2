<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registrar cuota - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Registrar cuota</title>
</head>

<body data-modulo="cuota" data-titulo="Registrar Cuota">

<div class="cdk-pagina">

    <section class="cdk-seccion">
        <h2 class="cdk-seccion__titulo">Registrar mi cuota del mes</h2>
        <p class="cdk-seccion__sub">
            Se registra <strong>una vez al mes</strong> y no se puede cambiar después. El
            avance aparece en cuanto la guardes.
        </p>

        <div id="estado"></div>

        <form id="form-cuota" class="hidden">
            <div class="cdk-campo">
                <label class="cdk-campo__etiqueta" for="monto">Mi cuota de este mes</label>
                <input type="number" id="monto" class="cdk-entrada"
                       inputmode="decimal" step="0.01" min="0.01"
                       autocomplete="off" placeholder="Ej: 380000">
                <p class="cdk-campo__ayuda">En dólares. Tiene que ser mayor que cero.</p>
            </div>

            <button type="submit" id="btn-guardar" class="cdk-boton cdk-boton--primario">
                Registrar
            </button>
        </form>

        <div id="resultado" style="margin-top:12px"></div>
    </section>

</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<script src="/js/cuota/registrar.js"></script>
</body>
</html>
