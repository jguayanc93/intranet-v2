<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Avance de cuota - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Mi cuota</title>
</head>

<body data-modulo="cuota" data-titulo="Mi Cuota">

<div class="cdk-pagina">

    <!-- ============ EL AVANCE DEL MES ============ -->
    <!-- Segmento 1. Es el que importa y el único que se conserva: los otros
         dos se retiraron y en su sitio van los cuatro bloques de abajo. -->
    <section class="cdk-seccion" id="seccion-avance">
        <h2 class="cdk-seccion__titulo">Mi cuota de este mes</h2>

        <div id="avance"></div>
    </section>

    <!-- ============ CÓMO VAS DE RITMO ============ -->
    <section class="cdk-seccion hidden" id="seccion-ritmo">
        <h2 class="cdk-seccion__titulo">Cómo vas de ritmo</h2>
        <div id="ritmo"></div>
    </section>

    <!-- ============ LAS NOTAS DE CRÉDITO ============ -->
    <section class="cdk-seccion hidden" id="seccion-notas">
        <h2 class="cdk-seccion__titulo">Lo que te restan las notas de crédito</h2>
        <div id="notas"></div>
    </section>

    <!-- ============ A QUIÉN LLAMAR ============ -->
    <section class="cdk-seccion hidden" id="seccion-reposicion">
        <h2 class="cdk-seccion__titulo">A quién llamar</h2>
        <p class="cdk-seccion__sub">
            Clientes tuyos con compras vencidas, por lo que suelen reponer. Es una lista de
            candidatos para priorizar, no una venta hecha.
        </p>
        <div id="reposicion"></div>
    </section>

</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<script src="/js/cuota/avance.js"></script>
</body>
</html>
