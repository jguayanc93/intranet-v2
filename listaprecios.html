<!-- Una sola pantalla, para el grupo 20 (cartera y cobertura): la lista de precios de venta, en dólares, sin IGV y con IGV, para verla aquí o
     bajarla a Excel. Es solo lectura. No lleva costo ni stock ni códigos del sistema (la lista puede llegar a manos de los clientes), y se
     filtra aquí, en el navegador: son unas 6 400 filas que llegan de una vez. La clave de menú es `listaprecios` y NO `reporte`, que es el
     menú de reportes por marca del grupo 25. -->

</div>
