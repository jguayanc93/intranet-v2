<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pedidos - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Pedidos</title>
</head>

<body data-modulo="listas" data-titulo="Pedidos">

<div class="cdk-pagina">

    <section class="cdk-seccion">
        <h2 class="cdk-seccion__titulo">Pedidos</h2>
        <p class="cdk-seccion__sub">Todos tus pedidos, el último primero.</p>

        <!-- Sin fecha se piden todas; con fecha, las de ese día. Son dos rutas
             distintas del backend, no un parámetro. -->
        <div class="cdk-campo">
            <label class="cdk-campo__etiqueta" for="fecha-dia">Filtrar por fecha</label>
            <input type="date" id="fecha-dia" class="cdk-entrada">
        </div>

        <div class="cdk-acciones-fila">
            <button type="button" id="btn-limpiar" class="cdk-boton cdk-boton--suave">
                Quitar el filtro
            </button>
        </div>

        <div id="npedis" style="margin-top:12px"></div>
    </section>

</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<!-- Las tres listas comparten implementación: solo cambia lo que se declara. -->
<script src="/js/listas/lista.js"></script>
<script>
CDK.listo(function () {
    CDK.listas.montar({
        destino:      "npedis",
        plural:       "pedidos",
        ruta:         "/lista/pedidos",
        rutaDia:      "/lista/pedidosxdia",
        campos:       CDK.listas.CAMPOS.pedido
        /* Sin `estadoNormal` a propósito: un pedido solo puede estar
           `aprobado` o `atendido`, y la diferencia entre los dos es
           justamente lo que el vendedor viene a mirar. Ocultar uno de ellos
           por «normal» escondería la mitad de la información. */
    });
});
</script>
</body>
</html>
