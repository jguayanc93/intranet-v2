<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clientes - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Clientes</title>
</head>

<body data-modulo="listas" data-titulo="Clientes">

<div class="cdk-pagina">

    <!-- ============ LA LISTA ============ -->
    <section class="cdk-seccion" id="seccion-lista">
        <h2 class="cdk-seccion__titulo">Clientes</h2>
        <p class="cdk-seccion__sub">Toca un cliente para ver cómo va el mes con él.</p>

        <!-- Antes esto era una pantalla de selección con dos botones grandes que
             llevaban a dos tablas separadas. Son dos conjuntos del mismo dato,
             así que ahora alternan en el sitio: un toque menos y no se pierde
             de vista dónde se está.

             «Cobertura» no son los clientes sin dueño, ni los que facturó sin
             tenerlos asignados: es TODO lo que facturó este mes, suyos o no.
             Las dos vistas se solapan. De ahí el nombre del botón, que dice
             lo que hay dentro y no intenta traducir la palabra del backend. -->
        <div class="cdk-acciones-fila" role="group" aria-label="Qué clientes">
            <button type="button" id="btn-cartera" class="cdk-boton cdk-boton--primario" aria-pressed="true">
                Mi cartera
            </button>
            <button type="button" id="btn-cobertura" class="cdk-boton cdk-boton--suave" aria-pressed="false">
                Facturado este mes
            </button>
        </div>

        <div class="cdk-busca" style="margin-top:12px">
            <svg class="cdk-busca__lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            <!-- Filtra lo ya cargado, sin ir al backend: la lista de clientes de
                 un vendedor cabe entera y recorrerla a mano es lo lento. -->
            <input type="search" id="filtro" class="cdk-entrada"
                   placeholder="Filtrar por nombre" autocomplete="off">
            <button id="btn-limpiar-filtro" type="button" class="cdk-busca__limpiar hidden" aria-label="Limpiar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" class="cdk-icono cdk-icono--sm" aria-hidden="true">
                    <path d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div id="lista-clientes" style="margin-top:12px"></div>
    </section>

    <!-- ============ UN CLIENTE ============ -->
    <section class="cdk-seccion hidden" id="seccion-cliente">
        <div class="cdk-paso__cabecera">
            <button type="button" id="btn-volver" class="cdk-navbar__atras" aria-label="Volver a la lista">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round" class="cdk-icono" aria-hidden="true">
                    <path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                </svg>
            </button>
            <h2 class="cdk-paso__titulo" id="titulo-cliente">Cliente</h2>
        </div>

        <div id="detalle-cliente"></div>
    </section>

</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<script src="/js/listas/clientes.js"></script>
</body>
</html>
