<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de control - CDK Sistema de Gestión de Ventas">
    <link rel="stylesheet" href="/core/cdk-shell.css">
    <title>CDK · Panel de Control</title>
</head>

<!-- data-shell="inicio": monta el shell sin módulo activo y sin botón de volver.
     El navbar, el sidebar y la barra inferior los inyecta core/cdk-shell.js. -->
<body data-shell="inicio" data-titulo="Panel de Control">

<!-- El lienzo va de borde a borde: el fondo que sube el usuario desde
     Configuración se ve a todo el ancho. El contenido de dentro lo sigue
     centrando .cdk-pagina. -->
<div class="cdk-lienzo" id="lienzo">
    <div class="cdk-pagina">
        <header class="cdk-cabecera">
            <h1 class="cdk-cabecera__titulo">Bienvenido</h1>
            <p class="cdk-cabecera__sub">Accede a los módulos habilitados para tu cuenta</p>
        </header>

        <div id="modulos"></div>
    </div>
</div>

<!-- ===== BLOQUE CORE: orden obligatorio ===== -->
<script src="/core/cdk.js"></script>
<script src="/core/cdk-rutas.js"></script>
<script src="/core/cdk-http.js"></script>
<script src="/core/cdk-sesion.js"></script>
<script src="/core/cdk-catalogo.js"></script>
<script src="/core/cdk-permisos.js"></script>
<script src="/core/cdk-ajustes.js"></script>
<script src="/core/cdk-ui.js"></script>
<script src="/core/cdk-formato.js"></script>
<script src="/core/cdk-shell.js"></script>

<script>
(function () {
    "use strict";

    var destino = document.getElementById("modulos");

    CDK.ajustes.aplicarFondo(document.getElementById("lienzo"));

    function pintar(modulos) {
        var claves = CDK.catalogo.ordenar(Object.keys(modulos || {}));

        if (!claves.length) {
            CDK.estados.vacio(destino, "Tu cuenta no tiene módulos habilitados. Contacta con sistemas.");
            return;
        }

        var lista = CDK.el("ul", { clase: "cdk-tarjetas" });

        claves.forEach(function (clave) {
            var meta = CDK.catalogo.modulo(clave);

            lista.appendChild(CDK.el("li", {}, [
                CDK.el("a", { href: CDK.catalogo.hub(clave), clase: "cdk-tarjeta" }, [
                    CDK.el("span", { clase: "cdk-tarjeta__icono" }, [CDK.svg(meta.icono, "cdk-icono")]),
                    CDK.el("span", { clase: "cdk-tarjeta__titulo", texto: meta.etiqueta }),
                    CDK.el("span", { clase: "cdk-tarjeta__texto", texto: modulos[clave] || "" }),
                    CDK.el("span", { clase: "cdk-tarjeta__pie", texto: "Acceder →" })
                ])
            ]));
        });

        destino.innerHTML = "";
        destino.appendChild(lista);
    }

    function cargar() {
        CDK.estados.cargando(destino, "Cargando módulos…");

        // El shell ya pidió /vendedor; esta llamada reutiliza esa misma promesa
        // o la caché, así que no genera una segunda petición.
        CDK.permisos.modulos()
            .then(pintar)
            .catch(function (err) {
                if (!CDK.http.esError(err)) {
                    CDK.estados.error(destino, err, cargar);
                    return;
                }

                // Ya redirige al login por su cuenta.
                if (err.status === 401) return;

                /* Estos dos no son culpa de quien entra ni se arreglan
                   reintentando: su tipo de vendedor no tiene ruta en el
                   direccionador, o su grupo no tiene mapa de modulos. Decirle
                   "reintenta" lo deja pulsando un boton que nunca va a
                   funcionar; decirle a quien avisar, no. */
                var deConfiguracion =
                    err.status === 404 ||
                    (err.status === 400 && err.datos && err.datos.status === "no identificado");

                if (deConfiguracion) {
                    CDK.estados.error(
                        destino,
                        "Tu usuario no tiene módulos asignados todavía. " +
                        "Avisa al equipo de sistemas: no es algo que puedas resolver desde aquí.",
                        null
                    );
                    return;
                }

                CDK.estados.error(destino, err, cargar);
            });
    }

    cargar();
})();
</script>
</body>
</html>
